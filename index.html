<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>亲子AI创造资料库</title>
  <meta name="description" content="选一个主题，和孩子一起想点子、向 AI 说清需求、制作和改进自己的小作品。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-header">
    <a class="brand" href="#home"><span class="brand-icon" aria-hidden="true">✳</span>亲子AI创造资料库</a>
    <a class="header-link" href="#themes">探索主题 <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main">
    <section class="local-account" id="local-account" aria-label="账号">
  <span id="account-greeting" aria-live="polite">未登录</span>
  <button id="account-register" type="button">注册</button>
  <button id="account-login" type="button">登录</button>
  <button id="account-logout" type="button" hidden>退出</button>
  <form id="account-form" hidden>
    <label>用户名 <input name="username" required maxlength="24" autocomplete="username"></label>
    <label>密码 <input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label>
    <button id="account-submit" type="submit">确认登录</button>
  </form>
  <span id="account-message" role="status"></span>
  <a id="account-service-link" href="http://127.0.0.1:3000/" target="_blank" rel="noopener" hidden>打开带登录功能的网站 ↗</a>
</section>
    <div id="home">
      <section class="hero">
        <div class="hero-cosmos" aria-hidden="true"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="planet"></span><span class="cosmos-glyph glyph-one">✦</span><span class="cosmos-glyph glyph-two">✳</span><span class="cosmos-glyph glyph-three">✧</span></div>
        <div class="hero-copy">
        <span class="eyebrow">大人 + 孩子 + AI</span>
        <h1>小小脑洞，<span>一起造出来。</span><span class="spark" aria-hidden="true">✦</span></h1>
        <p class="hero-intro">这里是属于你和孩子的亲子 AI 创造资料库。不同主题，带着孩子一起手搓 AI 小工具，打开脑洞，学会用 AI，还很有趣。</p><span class="update-label"><i aria-hidden="true"></i>持续更新中</span>
        <div class="hero-bottom"><a class="primary" href="#themes">选一个，开始创造 <span aria-hidden="true">↓</span></a><span class="hero-note">不用先会写代码 · 按步骤一起做</span></div>
      </div>
      </section>
      <section id="themes" class="themes" tabindex="-1" aria-labelledby="themes-title">
        <div class="section-heading"><h2 id="themes-title">今天，一起创造什么？</h2><span class="count" id="theme-count"></span></div>
        <div class="cards" id="theme-cards"></div>
      </section>
    </div>
    <div id="topic-pages"></div>
    <noscript><p class="block">请启用浏览器的 JavaScript，查看主题步骤与复制提示词。本页不需要安装插件。</p></noscript>
  </main>
  <footer><span>亲子AI创造资料库</span><span>孩子出主意，大人陪着做。</span></footer>
  <script src="topics.js"></script>
  <script src="script.js"></script>
</body>
</html>
